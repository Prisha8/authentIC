<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Business Login — authentIC</title>

  <!-- Using system fonts for offline support -->
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-left" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
      <img src="assets/logo.png" alt="authentIC logo" style="width:28px;height:28px;" />
      <span>authentIC</span>
    </a>
    <nav class="nav-right">
      <a href="login.html">Back</a>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-box form-box">
      <h1>Business Login</h1>
      <p class="subtitle">Sign in to manage company reports & team access</p>

      <form id="businessForm" class="auth-form" autocomplete="on">
        <label class="form-label">
          Company Email
          <input id="bEmail" name="email" type="email" required placeholder="admin@company.com" />
        </label>

        <label class="form-label">
          Company ID
          <input id="companyId" name="companyId" type="text" required placeholder="Company ID or Org Name" />
        </label>

        <label class="form-label">
          Password
          <input id="bPassword" name="password" type="password" required minlength="6" placeholder="Enter your password" />
        </label>

        <button type="submit" class="btn-primary">Login</button>

        <div class="separator"><span>or</span></div>

        <button id="bGoogle" type="button" class="btn-google">
          <!-- same google icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:10px" aria-hidden>
            <path fill="#EA4335" d="M12 11.2v2.9h4.6c-.2 1.2-.9 2.2-1.9 2.9v2.4h3.1c1.8-1.6 2.8-4.2 2.8-7.2 0-.6-.1-1.2-.2-1.8H12z"/>
            <path fill="#34A853" d="M6.9 14.1c-.5-1- .5-2.2 0-3.2V8.5H3.8C3 9.9 2.6 11.6 3 13.4c.4 1.8 1.6 3.3 3 4.3l1. -3.6z"/>
            <path fill="#4A90E2" d="M12 6.6c1 0 1.8.3 2.5.8l1.8-1.8C15.9 4.9 14.1 4 12 4 8.9 4 6.3 5.9 4.8 8.8l2.8 2.2C8.4 10.1 10.1 8.6 12 8.6z"/>
            <path fill="#FBBC05" d="M4.8 8.8L3 11c1.2-2.6 3.9-4.4 6.9-4.4 1.7 0 3.2.6 4.3 1.6l-1.8 1.8C11.9 9.2 10 8.6 8 8.6 6.7 8.6 5.4 8.9 4.8 8.8z"/>
          </svg>
          Login with Google
        </button>

        <p class="muted small">Need assistance? <a href="mailto:support@example.com">Contact support</a></p>
      </form>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
