<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detect Fake ICs — Query</title>

  <!-- Using system fonts for offline support -->
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <div class="app-shell">

    <!-- TOP NAVBAR -->
    <nav class="top-nav">
      <div class="nav-left">
        <button id="toggleSidebar" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="index.html" class="brand-link" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;">
          <img src="assets/logo.png" alt="authentIC logo" class="brand-logo" />
          <span class="nav-title">authentIC</span>
        </a>
      </div>
      <div class="nav-right">
        <button class="profile-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Profile</span>
        </button>
        <button class="icon-btn" id="logoutBtn" title="Logout" style="margin-left:10px;background:#fff;border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <!-- Removed 'IC Detector' brand -->
    <nav class="menu">
      <button id="newChatBtn" class="menu-item new-chat-btn" data-i18n="nav.newChat">＋ New Chat</button>

      <a class="menu-item" href="dashboard.html">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
        </svg>
        <span data-i18n="nav.dashboard">Dashboard</span>
      </a>

      <a class="menu-item" href="#">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5A6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5L21.5 19l-6-5z"/>
        </svg>
        <span data-i18n="nav.searchChats">Search Chats</span>
      </a>

      <a class="menu-item" href="#">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M4 6h16v12H4z M6 8v8h12V8z"/>
        </svg>
        <span data-i18n="nav.library">Library</span>
      </a>
    </nav>
  </div>

  <div class="chats">
    <h4 data-i18n="nav.recentChats">Chats</h4>
    <ul id="chatList"></ul>
  </div>

  <div class="sidebar-footer">
    <small>© 2025 authentIC</small>
  </div>
</aside>


    <!-- MAIN -->
    <main class="main">
      <section class="chat-area">
        <div id="messages" class="messages">
          <div class="empty-state">
            <p data-i18n="query.emptyState">Start a new detection by attaching an image and writing a prompt below.</p>
          </div>
        </div>
      </section>

      <div class="composer">
        <div id="imagePreview" class="image-preview" style="display:none;">
          <div class="preview-container">
            <img id="previewImg" src="" alt="Preview" />
            <button id="removePreview" class="remove-preview" type="button" title="Remove image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <textarea id="prompt" data-i18n-placeholder="query.promptPlaceholder" placeholder="Describe the IC markings or upload an image for analysis."></textarea>
        <div class="composer-actions">
        <label class="file-label" id="attachLabel" title="Attach image">
  <div class="attach-icon">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path d="M21 12.79V17a5 5 0 0 1-10 0V7a3 3 0 0 1 6 0v8a1 1 0 0 1-2 0V8" />
  </svg>
  </div>
  <input id="imgInput" type="file" accept="image/*" />
  <span class="attach-text" data-i18n="query.attach">Attach Image</span>
</label>
          <button id="sendBtn" class="btn-send" data-i18n="query.detect">Detect</button>
          <button id="saveChatBtn" class="btn-secondary" data-i18n="query.saveChat">Save Chat</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Config -->
  <script src="js/supabase-config.js"></script>
  <!-- Static Translations -->
  <script src="js/translations.js"></script>
  <!-- Translation API (uses static + API fallback) -->
  <script src="js/translate-api.js"></script>
  <script src="js/chat.js"></script>
</body>

</html>
